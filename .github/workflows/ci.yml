name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # Install the runtime deps declared in pyproject without building the
        # project itself (it isn't a packaged distribution). twilio stays out:
        # the WhatsApp notifier imports it lazily and tests run in DRY_RUN.
        run: |
          python -m pip install --upgrade pip
          pip install $(python -c "import tomllib; print(' '.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))")

      - name: Run tests
        # `python -m pytest` puts the repo root on sys.path so `app` and
        # `scripts` import without an editable install.
        run: python -m pytest -q
