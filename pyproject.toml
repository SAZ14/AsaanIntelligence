[project]
name = "asaanpay-audit"
version = "0.1.0"
description = "POS-integrated restaurant integrity agent — leakage, profit & reconciliation, with a WhatsApp channel"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
    "pytest>=8.0",
    "anthropic>=0.39",
    "twilio>=9.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Live competitive-intelligence backends. Optional: the agent runs fully
# offline on bundled fixtures + the JSON store when these are absent.
scrape = ["browserbase>=0.3", "playwright>=1.40"]
storage = ["supabase>=2.0"]

[tool.setuptools.packages.find]
# Only `app` is an importable package; scripts/ tests/ evals/ run via sys.path.
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
