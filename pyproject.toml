[project]
name = "asaanpay-central"
version = "0.2.0"
description = "AsaanPay central agent server — scout, integrity, revenue, reputation, and customer agents"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",  # staff dashboard (server-rendered pages, app/gateway/dashboard.py)

    # Data layer
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",

    # AI / LLM — OpenAI-compatible client for Z.AI / GLM-4.7
    "openai>=1.0",

    # Messaging
    "twilio>=9.0",

    # Data / validation
    "pydantic>=2.0",

    # HTTP client
    "httpx>=0.27",

    # Scraping — scout agent + reputation pipeline
    "apify-client>=1.7",
    "beautifulsoup4>=4.12",
    "tenacity>=8.0",

    # Document processing — customer agent PDF ingest
    "pypdf>=4.0",
    "sentence-transformers>=2.7",

    # Scheduling — winback / leaderboard background jobs
    "apscheduler>=3.10",

    # Caching
    "redis>=5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "fakeredis>=2.0",  # Redis-path coverage in tests/test_guards.py
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
