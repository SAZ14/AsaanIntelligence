[project]
name = "asaanpay-central"
version = "0.2.0"
description = "AsaanPay central agent server — integrates scout, integrity, revenue, and customer agents"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",

    # Data layer
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "supabase>=2.0",

    # AI / LLM
    "anthropic>=0.39",
    "groq>=0.9",

    # Messaging
    "twilio>=9.0",

    # Data / analysis
    "pydantic>=2.0",
    "pandas>=2.0",

    # Scraping / discovery (scout agent)
    "firecrawl-py>=0.0.16",
    "httpx>=0.27",

    # Document processing (customer agent)
    "pypdf2>=3.0",
    "sentence-transformers>=2.7",

    # PDF generation (integrity agent)
    "reportlab>=4.0",
    "matplotlib>=3.8",
    "jinja2>=3.1",

    # Scheduling (winback / leaderboard jobs)
    "apscheduler>=3.10",

    # Testing
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
