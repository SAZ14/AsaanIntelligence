[project]
name = "asaanpay-audit"
version = "0.1.0"
description = "POS-integrated restaurant integrity agent — leakage, profit & reconciliation, with a WhatsApp channel"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
    "pytest>=8.0",
    "anthropic>=0.39",
    "twilio>=9.0",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
