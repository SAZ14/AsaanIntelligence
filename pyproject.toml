[project]
name = "asaanpay-audit"
version = "0.1.0"
description = "Offline audit tool for café sales data — leakage & retention analytics"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
    "pytest>=8.0",
    "anthropic>=0.39",
    "httpx>=0.27",
    "twilio>=9.0",
    "python-multipart>=0.0.9",
    "apify-client>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
