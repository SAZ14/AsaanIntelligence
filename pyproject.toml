[project]
name = "asaanpay-audit"
version = "0.1.0"
description = "Offline audit tool for café sales data — leakage & retention analytics"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
    "pytest>=8.0",
    "anthropic>=0.39",
]

[project.optional-dependencies]
# QR poster generation for the loyalty programme (scripts/generate_qr.py).
qr = ["qrcode[pil]>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
