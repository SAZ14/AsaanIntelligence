{% extends "base.html" %}
{% block title %}Choose a store — Queue Dashboard{% endblock %}
{% block body %}
<div class="auth-shell">
  <h1>Which store?</h1>
  <p class="lede">You manage more than one — pick one to continue.</p>
  <form method="post" action="/dashboard/select-store">
    {% for store in stores %}
    <div class="field">
      <label style="text-transform:none;letter-spacing:0;font-size:0.95rem;">
        <input type="radio" name="store_id" value="{{ store.id }}" required style="width:auto;"> {{ store.name }}
      </label>
    </div>
    {% endfor %}
    <button type="submit">Continue</button>
  </form>
</div>
{% endblock %}
