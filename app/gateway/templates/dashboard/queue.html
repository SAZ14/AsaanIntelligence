{% extends "app_base.html" %}
{% block title %}Queue: {{ store_name }}{% endblock %}
{% block content %}
{% if branch_tabs %}
<nav class="tabs" style="margin-bottom:16px;">
  {% for t in branch_tabs %}
  <a href="/dashboard/queue?branch={{ t.branch_key }}" class="{% if t.active %}active{% endif %}">{{ t.branch_name }}</a>
  {% endfor %}
</nav>
{% endif %}
<div id="queue-board">
  {% include "_queue_fragment.html" %}
</div>
<script>
  async function refreshQueue() {
    try {
      const res = await fetch('/dashboard/queue/fragment' + window.location.search, {credentials: 'same-origin'});
      if (res.ok) {
        document.getElementById('queue-board').innerHTML = await res.text();
      } else if (res.status === 303 || res.redirected) {
        window.location.reload();
      }
    } catch (e) { /* offline blip -- next poll retries */ }
  }
  setInterval(refreshQueue, 5000);
</script>
{% endblock %}
